<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="flightdeck-version" content="dev">
<title>Flightdeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23E7A300%27/%3E%3Cpath d=%27M4 8.5l2.5 2.5L12 5%27 stroke=%27%2316202A%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
<style>
/* Barlow Condensed, embedded so every computer sees the same headings (SIL Open Font License, src/fonts/OFL.txt). */
/*@FONTS@*/
/* Layout: a calm flight deck. Home answers "what needs me?"; a run shows phases on a rail, the current phase in the middle, references and team notes on the right. System fonts only; no external resources. */
:root {
  --paper: #F3F5F1; --card: #FFFFFF; --ink: #16202A; --muted: #59646E; --line: #D6DCD4; --field: #7D877F; --chip: #E8ECE6;
  --amber: #E7A300; --on-amber: #241A00; --stripe: #16202A; --amber-soft: #FBF0D2;
  --go: #1D7650; --go-soft: #E1F0E8; --stop: #B0261E; --stop-soft: #F7E3E1; --plan: #5A55A8; --plan-soft: #ECEBF8;
  --focus: #2E6BD3; --shadow: 0 1px 0 rgba(22,32,42,.05), 0 8px 24px rgba(22,32,42,.07);
  --display: 'Barlow Condensed', 'Bahnschrift SemiCondensed', 'Arial Narrow', sans-serif;
  --body: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace;
  --label: var(--body);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1418; --card: #162027; --ink: #E6ECEF; --muted: #98A6B0; --line: #29353F; --field: #6E7D88; --chip: #1E2A33;
  --amber: #F2B705; --on-amber: #1A1300; --stripe: #0E1418; --amber-soft: #3A3010;
  --go: #3CC08A; --go-soft: #163327; --stop: #F2776C; --stop-soft: #3A1F1D; --plan: #A9A5F2; --plan-soft: #25243F;
  --focus: #86B4FF; --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #162027; --ink: #E6ECEF; --muted: #98A6B0; --line: #29353F; --field: #6E7D88; --chip: #1E2A33;
  --amber: #F2B705; --on-amber: #1A1300; --stripe: #0E1418; --amber-soft: #3A3010;
  --go: #3CC08A; --go-soft: #163327; --stop: #F2776C; --stop-soft: #3A1F1D; --plan: #A9A5F2; --plan-soft: #25243F;
  --focus: #86B4FF; --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
a { color: var(--focus); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
.ic svg { width: 100%; height: 100%; display: block; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 10px; max-width: 1480px; margin: 0 auto; }
.runstrip { flex-basis: 100%; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.runstrip .rs-title { font-family: var(--display); font-size: 19px; letter-spacing: .01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
.runstrip .rs-sub { color: var(--muted); }
.runstrip .rs-now { color: var(--ink); }
.runstrip .rs-count { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.runstrip .rs-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: none; }
.runstrip .rs-dot.paused { background: var(--plan); } .runstrip .rs-dot.complete { background: var(--go); } .runstrip .rs-dot.stopped, .runstrip .rs-dot.blocked { background: var(--stop); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; border: 0; background: none; padding: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 5px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, var(--stripe) 5px 10px); }
.mainnav { display: flex; gap: 2px; flex-wrap: wrap; }
.mainnav button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.mainnav button:hover { background: var(--paper); color: var(--ink); }
.mainnav button[aria-current="page"] { background: var(--ink); color: var(--card); }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 2px 4px; color: var(--muted); }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; margin-left: auto; }
.dotlive { width: 8px; height: 8px; border-radius: 50%; background: var(--go); display: inline-block; }
.dotlive.off { background: var(--amber); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.me select, .me input { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 8px; max-width: 170px; }

main { max-width: 1480px; margin: 0 auto; padding-block: 22px 70px; }
.eyebrow { font-family: var(--label); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 21px; margin: 0 0 10px; letter-spacing: .02em; }
h2 > .ic:first-child { margin-right: 6px; }
h3 { font-family: var(--display); font-size: 18px; margin: 0 0 8px; }
.small { font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 7px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.go { background: var(--go); color: var(--card); border-color: var(--go); }
.btn.stop { background: var(--stop); color: var(--card); border-color: var(--stop); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mini:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
/* Step-type cards sit in a tree list; their own buttons keep the small-button look, not the list-row look. */
.plist .tcard button.mini { width: auto; display: inline-flex; text-align: center; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; font-size: 13px; }
.plist > li.tcard { list-style: none; }
.mini:disabled { opacity: .4; cursor: not-allowed; }
.chipbtn { border: 1px solid var(--line); background: var(--chip); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.cat { font-family: var(--label); font-weight: 600; font-size: 11px; line-height: 1.3; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
/* On a card the label can be long (process and who planned it): it wraps inside the card instead of running past it. */
.card .cat { white-space: normal; max-width: 100%; overflow-wrap: anywhere; align-self: flex-start; }
.big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--go); }
.notice { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 8px; background: var(--chip); margin-bottom: 14px; font-size: 14px; }
.notice.bad { background: var(--stop-soft); }
.notice.warn { background: var(--amber-soft); }
.notice.good { background: var(--go-soft); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--field); background: var(--card); border-radius: 7px; padding: 7px 10px; color: var(--ink); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--ink); color: var(--paper); flex: none; }
.avatar.lg { width: 28px; height: 28px; font-size: 11px; }
.pill { font-family: var(--label); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.passed, .pill.complete { background: var(--go-soft); color: var(--go); }
.pill.waived { background: var(--plan-soft); color: var(--plan); }
.pill.failed, .pill.stopped { background: var(--stop-soft); color: var(--stop); }
.pill.review, .pill.working, .pill.open { background: var(--amber-soft); color: var(--ink); }
.pill.ready { background: var(--go); color: var(--card); }
.pill.locked { background: var(--chip); color: var(--muted); }

/* Home */
.hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 24px; border-radius: 14px; background: var(--ink); color: var(--paper); margin-bottom: 26px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: repeating-linear-gradient(-45deg, var(--amber) 0 6px, var(--stripe) 6px 12px); }
.hero-text { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); line-height: 1.15; max-width: 60ch; text-wrap: balance; }
.hero .small { color: color-mix(in srgb, var(--paper) 70%, transparent); }
.hero .btn { background: var(--amber); color: var(--on-amber); border-color: var(--amber); margin-right: 14px; }
.home { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 26px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-bottom: 28px; }
.card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
button.card:hover { border-color: var(--ink); }
.card.plan { border-style: dashed; border-color: var(--plan); }
.card-title { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.state { font-size: 13.5px; font-weight: 600; }
.state.ready, .state.complete { color: var(--go); } .state.stopped { color: var(--stop); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.plist button { width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.plist button:hover { background: var(--card); }
.plist .t { font-weight: 600; }
.plist.tree, .plist.tree .plist { gap: 2px; }
.pskills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 10px 10px; }
.pskills > .small { display: inline-flex; align-items: center; gap: 4px; }
.plist .pskills button.skillchip { width: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; }
.plist .pskills button.skillchip:hover { border-color: var(--ink); }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rlist .row { justify-content: space-between; align-items: center; }
.rlist .t { font-weight: 600; }
.tgroup > details > summary { cursor: pointer; padding: 6px 4px; font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 14px; }
.tgroup > details > .plist { margin-left: 12px; border-left: 2px solid var(--line); padding-left: 6px; }
.tagbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); border: 1px solid transparent; }
button.tag { cursor: pointer; }
button.tag.on { background: var(--plan-soft); color: var(--plan); border-color: var(--plan); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 1 / -1; }
.library .seg { margin-bottom: 4px; }
.filter { display: inline-flex; gap: 4px; padding: 3px; border-radius: 99px; background: var(--chip); }
.filter .chipbtn { border: 0; background: none; }
.filter .chipbtn[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }

/* Run */
.runhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip .v { font-family: var(--mono); font-size: 12.5px; }
.chip span.k { color: var(--muted); }
.chip.empty { border-style: dashed; color: var(--muted); }
.inline-edit { display: inline-flex; gap: 6px; align-items: center; }
.inline-edit input, .inline-edit select { border: 1px solid var(--ink); border-radius: 6px; padding: 3px 8px; font-family: var(--mono); font-size: 12.5px; width: 180px; background: var(--card); }
.headline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 18px; border-radius: 12px; margin-bottom: 18px; border: 1px solid var(--line); background: var(--card); }
.headline[data-s="working"] { border-left: 6px solid var(--amber); }
.headline[data-s="ready"] { border-left: 6px solid var(--go); background: var(--go-soft); }
.headline[data-s="stopped"] { border-left: 6px solid var(--stop); background: var(--stop-soft); }
.headline[data-s="complete"] { border-left: 6px solid var(--go); }

.deck { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.phase { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; overflow: clip; }
.phase[data-s="locked"] { opacity: .55; }
.placard { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 10px 16px 10px 28px; background: var(--amber); color: var(--on-amber); position: relative; }
/* While a run scrolls, each open phase's placard stays pinned under the top bar until its phase has scrolled past. */
.phase[data-s="open"] .placard { position: sticky; top: var(--top-h, 64px); z-index: 3; box-shadow: 0 2px 6px rgba(22,32,42,.12); }
.p-count { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; opacity: .8; }
.step, .gate, .phase { scroll-margin-top: calc(var(--top-h, 64px) + var(--placard-h, 48px) + 8px); }
.placard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, var(--stripe) 5px 10px); }
.phase[data-s="done"] .placard { background: var(--go-soft); color: var(--ink); }
.phase[data-s="done"] .placard::before { background: var(--go); }
.phase[data-s="locked"] .placard { background: var(--chip); color: var(--muted); }
.phase[data-s="locked"] .placard::before { background: var(--line); }
.p-label { font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.p-title { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0; }
.mode { margin-left: auto; font-family: var(--label); font-weight: 600; font-size: 11px; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; border: 1.5px solid currentColor; }
.mode-hint { width: 100%; font-size: 13px; opacity: .85; }
.folded { padding: 10px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 16px; border-top: 1px solid var(--line); }
.steps .step:first-child { border-top: 0; }
.step.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--focus); }
.step[data-a="blocked"] { background: var(--stop-soft); }
.step[data-a="recheck"] { background: var(--amber-soft); }
.check { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--ink); background: var(--card); display: grid; place-items: center; padding: 0; }
.check svg { width: 18px; height: 18px; opacity: 0; stroke: var(--card); transition: opacity .15s, transform .15s; transform: scale(.6); }
.check:disabled { cursor: default; }
.step[data-a="done"] .check { background: var(--go); border-color: var(--go); }
.step[data-a="done"] .check svg { opacity: 1; transform: scale(1); }
.step[data-a="na"] .check { border-style: dashed; border-color: var(--muted); }
.step[data-a="blocked"] .check { border-color: var(--stop); }
.s-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.s-text { font-size: 16px; font-weight: 500; line-height: 1.35; }
.step[data-a="done"] .s-text { color: var(--muted); }
.step[data-a="na"] .s-text { color: var(--muted); text-decoration: line-through; }
.type { display: inline-flex; gap: 5px; align-items: center; font-family: var(--label); font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.badge { font-family: var(--label); font-weight: 600; font-size: 11px; line-height: 1.3; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.b-must { background: var(--stop-soft); color: var(--stop); }
.b-plan { background: var(--plan-soft); color: var(--plan); }
.b-ref { background: var(--chip); color: var(--muted); }
.b-warn { background: var(--amber-soft); color: var(--ink); }
.b-stop { background: var(--stop); color: var(--card); }
.b-skill { background: var(--go-soft); color: var(--go); text-transform: none; letter-spacing: 0; }
.brief pre { white-space: pre-wrap; max-height: 320px; overflow: auto; font-size: 12px; background: var(--paper); padding: 10px; border-radius: 6px; }
.skills .skill { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.b-diff { background: var(--plan-soft); color: var(--plan); }
.fields { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.fchip { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip b { font-weight: 600; color: var(--muted); }
.cmd { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.cmd code { flex: 1; min-width: 0; padding: 6px 10px; overflow-x: auto; white-space: pre; display: block; }
.timer { font-family: var(--mono); font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--chip); font-variant-numeric: tabular-nums; }
.timer.over { background: var(--amber-soft); }
.b-time { background: var(--chip); color: var(--ink); font-variant-numeric: tabular-nums; }
.b-time.s-late, .b-time.s-started- { background: var(--stop-soft); color: var(--stop); }
.b-time.s-soon { background: var(--amber-soft); color: var(--ink); }
.b-time.s-done, .b-time.s-done-late { background: var(--go-soft); color: var(--go); }
.hint { display: block; color: var(--muted); margin: -2px 0 4px; }
.childbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.track { min-width: 0; border-top: 3px solid var(--plan); background: var(--paper); border-radius: 6px; padding: 8px 10px; }
.track-head { position: sticky; top: calc(var(--top-h, 64px) + var(--placard-h, 48px)); z-index: 2; background: var(--paper); padding-block: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.track-head h3 { margin: 0; font-family: var(--display); font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
.timeline { list-style: none; margin: 0 0 12px; padding: 0; border-left: 2px solid var(--line); }
.timeline li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 4px 0 4px 12px; position: relative; }
.timeline li::before { content: ''; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.timeline li[data-s="late"]::before, .timeline li[data-s="started-"]::before { background: var(--stop); }
.timeline li[data-s="soon"]::before { background: var(--amber); }
.timeline li[data-s^="done"]::before { background: var(--go); }
.tl-time { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 5ch; }
button.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
.grid-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: left; white-space: nowrap; }
table.grid td.cold { color: var(--muted); }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--plan); vertical-align: middle; }
.timer.due { background: var(--stop); color: var(--card); font-weight: 600; }
.stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.pick { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.pick input { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; min-width: 220px; background: var(--card); }
.pick.record { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--go); border-radius: 8px; background: var(--paper); margin-top: 6px; }
.pick.record .rf { display: flex; flex-direction: column; gap: 3px; }
.pick.record input, .pick.record select { min-width: 0; width: 100%; max-width: 420px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
.cmd.msg span { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 6px; background: var(--paper); border: 1px dashed var(--line); font-size: 13px; }
.fchip.rec { border-color: var(--go); }
.fchip.filled, .cmd.filled code, .cmd.filled span { border-style: dashed; border-color: var(--plan); }
.pick.record textarea { min-width: 0; width: 100%; max-width: 420px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }

.gate { padding: 14px 16px; border-top: 2px dashed var(--line); background: var(--paper); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.gate-title { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.gate[data-s="ready"] { background: var(--go-soft); }
.gate[data-s="review"], .gate[data-s="failed"] { background: var(--stop-soft); }
.gate .q { font-size: 14px; }
.gate .q code { font-size: 13px; }

.note { font-size: 14.5px; line-height: 1.55; }
.note p { margin: 0 0 8px; } .note ul { margin: 0 0 8px; padding-left: 18px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 92px; height: 60px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb:hover { border-color: var(--ink); }
.tnotes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.tnotes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; }
.tnotes .meta { font-size: 12px; color: var(--muted); }
.compose { display: flex; flex-direction: column; gap: 8px; }
.fixform fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.fixform .fix-h { margin: 0; font-size: 15px; }
.fixbox { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.p-fix { margin-left: auto; }
.fixlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fixlist > li { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.fixgroup { font-weight: 600; font-size: 13px; margin: 8px 0 0; overflow-wrap: anywhere; }
.compose textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 70px; resize: vertical; background: var(--paper); }

/* Process page */
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.mapview .ph { margin-bottom: 16px; }
.mapview .ph h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mapview .ph h3[id] { scroll-margin-top: calc(var(--top-h, 64px) + 12px); }
.mapview ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mapview li { display: flex; gap: 8px; align-items: baseline; font-size: 14.5px; }
.mapview .g { margin-top: 8px; font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
/* Flight plan: a vertical route, Start at the top and Landed at the bottom, joined by a dashed line down the left. It
   never wraps sideways, so it reads the same at any width. */
.mapview .fp { list-style: none; margin: 4px 0 10px; padding: 0 0 0 30px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.mapview .fp::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; border-left: 2px dashed var(--field); }
.mapview .fp > li { position: relative; display: flex; flex-direction: column; gap: 0; align-items: stretch; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.mapview .fp > li::before { content: ""; position: absolute; left: -25px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
.mapview .fp > .fp-end { gap: 2px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); align-self: flex-start; max-width: 100%; }
.mapview .fp > .fp-end::before { background: var(--ink); }
.fp-tag { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.fp-card { position: relative; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 10px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 6px 18px; min-width: 0; }
.fp-card:hover, .fp-card:focus-within { border-color: var(--ink); border-left-color: var(--amber); }
.fp-head, .fp-lines { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fp-eye { font-family: var(--label); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.fp-name { margin: 0; font-family: var(--display); font-size: 20px; line-height: 1.1; overflow-wrap: anywhere; }
.fp-go { border: 0; background: none; padding: 0; font: inherit; text-align: left; color: inherit; overflow-wrap: anywhere; max-width: 100%; }
/* The whole card is the phase's button for a pointer; the name stays the one control for keyboards and screen readers. */
.fp-go::after { content: ""; position: absolute; inset: 0; border-radius: 10px 10px 0 0; }
.fp-line { display: flex; gap: 6px; align-items: baseline; font-size: 13px; min-width: 0; }
.fp-line > span:not(.ic) { min-width: 0; overflow-wrap: anywhere; }
.fp-line .ic { flex: none; align-self: center; }
.fp-auto .ic { color: var(--go); } .fp-turb .ic, .fp-stale .ic { color: var(--stop); } .fp-stale { color: var(--stop); } .fp-follows { color: var(--muted); } .fp-conn .ic { color: var(--plan); }
.mapview .fp-lanes { list-style: none; margin: 4px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 6px; }
.mapview .fp-lane { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 8px; border-radius: 6px; background: var(--paper); border-top: 2px solid var(--field); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.fp-gate { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; padding: 8px 14px 8px 26px; background: var(--amber-soft); border-left: 4px solid var(--amber); border-radius: 0 0 10px 10px; min-width: 0; overflow-wrap: anywhere; }
.fp-gate:not(.implicit)::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, var(--stripe) 5px 10px); }
.fp-gate > span { min-width: 0; }
.fp-gate-t { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; }
.fp-gate.implicit { background: var(--card); border: 1px dashed var(--field); border-left: 4px solid var(--amber); padding-left: 14px; }
.vlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.vlist li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; font-size: 14px; }
.diff { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 420px; overflow: auto; white-space: pre-wrap; }
.diff .add { background: var(--go-soft); display: block; } .diff .del { background: var(--stop-soft); display: block; text-decoration: line-through; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.checks li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; }
.lvl { font-family: var(--label); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 2px 0; border-radius: 4px; height: fit-content; }
.lvl.bad { background: var(--stop-soft); color: var(--stop); } .lvl.tip { background: var(--plan-soft); color: var(--plan); } .lvl.ok { background: var(--go-soft); color: var(--go); }

/* Receipt */
.receipt { width: min(800px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.receipt .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.receipt .rt { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; }
.receipt h4 { margin: 4px 0; font-family: var(--display); font-size: 17px; display: flex; justify-content: space-between; gap: 10px; }
.rrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; font-size: 14px; padding: 3px 0; border-top: 1px solid var(--line); }
.ric { font-family: var(--label); font-weight: 600; text-align: center; }
.ric.done { color: var(--go); } .ric.na { color: var(--muted); } .ric.blocked { color: var(--stop); } .ric.recheck { color: var(--amber); }

/* Mission control: for the release call and screen sharing */
.mission { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; }
.mission .now { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 52px); line-height: 1.05; }
.mission .msteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 22px; }
.mission .msteps li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.mission .gates { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 18px; }
.mission .gates li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.mission .msteps li[data-a="blocked"] { background: var(--stop-soft); border-color: var(--stop); }
.mission .msteps li[data-a="recheck"] { background: var(--amber-soft); }
.m-why { display: block; font-size: 16px; color: var(--stop); font-weight: 600; }
.m-rec { font-size: 15px; font-weight: 600; }
.mission .clock { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; }

/* Lightbox and help */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8,12,16,.82); display: grid; place-items: center; padding: 16px; }
.lb-box { width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
.lb-media { background: var(--card); border-radius: 10px; overflow: auto; max-height: calc(100vh - 140px); }
.lb-media img { display: block; width: 100%; height: auto; }
.lb-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #EEF2F4; }
.lb-bar .cap { flex: 1; min-width: 0; font-weight: 600; }
.lb-bar button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #EEF2F4; border-radius: 7px; padding: 6px 12px; font-weight: 600; }
.help { background: var(--card); color: var(--ink); border-radius: 12px; padding: 20px 22px; width: min(460px, 100%); }
.help dl { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 6px 12px; margin: 0 0 12px; }
.help h3 { font-size: 14px; margin: 14px 0 4px; }
.help dt { font-family: var(--mono); font-weight: 600; }

@keyframes stamp { 0% { transform: scale(1.6) rotate(-8deg); opacity: 0; } 60% { transform: scale(.95) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
.called-stamp { display: inline-block; font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--go); border: 2px solid var(--go); border-radius: 6px; padding: 1px 8px; transform: rotate(-8deg); animation: stamp .35s ease-out both; }

/* Form fields need a 3:1 boundary to be findable (WCAG 1.4.11); decorative lines stay soft. */
input:not([type="checkbox"]):not([type="file"]):not([type="hidden"]), select, textarea { border-color: var(--field) !important; }
input[type="checkbox"] { accent-color: var(--go); width: 16px; height: 16px; }
.ferr { margin: 0; color: var(--stop); font-weight: 600; font-size: 13px; }
.linkish { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; font-size: 13px; }
.check-label { display: inline-flex; gap: 6px; align-items: center; }
.setup { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 22px; }
.setup h2 { margin-bottom: 12px; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.setup-grid > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.seg { display: inline-flex; border: 1px solid var(--field); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--card); padding: 7px 14px; font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--card); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.seg.tabs { margin: 0 0 14px; }
.ver-pick { max-width: 260px; min-width: 0; text-overflow: ellipsis; }
.seg button .ic { margin-right: 6px; vertical-align: -3px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 6px 8px; }
.todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.todo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px; background: var(--card); }
.todo.plan { border-left-color: var(--plan); } .todo.skill, .todo.sign { border-left-color: var(--go); } .todo.draft { border-left-color: var(--muted); }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); text-align: left; }
.tile:hover { border-color: var(--ink); }
.vlist.compact .clip { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
details.panel > summary { cursor: pointer; list-style: revert; }
.tile.warn { border-color: var(--stop); }
.howto { list-style: none; counter-reset: how; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.howto li { counter-increment: how; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; }
.howto li::before { content: counter(how); font-family: var(--display); font-size: 22px; color: var(--amber); line-height: 1; }
.status-card[data-s="update"], .status-card[data-s="missing"] { border-left: 4px solid var(--stop); }
.status-card[data-s="current"] { border-left: 4px solid var(--go); }
.status-card[data-s="unaffected"] { border-left: 4px solid var(--amber); }
.changes { margin: 6px 0 10px; padding-left: 18px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts ol { margin: 0; padding-left: 18px; }
.tile .big { font-family: var(--display); font-size: 32px; line-height: 1; }
.editor-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .editor-grid { grid-template-columns: minmax(0, 1fr); } }
.code-editor { width: 100%; min-height: 480px; font-family: var(--mono); font-size: 13px; line-height: 1.5; padding: 12px; border: 1px solid var(--field); border-radius: 8px; background: var(--card); color: var(--ink); resize: vertical; tab-size: 2; }
/* The outline builder: phase cards, step rows, gates as hazard-striped thresholds (.fp-gate), and landing slots that open while a step is dragged. */
.ob { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ob-phases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.ob-phases > li { display: flex; flex-direction: column; min-width: 0; }
.ob-ph-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 14px 6px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-bottom: 0; border-radius: 10px 10px 0 0; min-width: 0; }
.ob-ph-head .fp-eye { flex-basis: 100%; }
.ob-ph-h { margin: 0; font-family: var(--display); font-size: 20px; line-height: 1.1; min-width: 0; }
.ob-ph-name { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; overflow-wrap: anywhere; max-width: 100%; }
.ob-phase.sel .ob-ph-head { box-shadow: inset 0 0 0 2px var(--ink); }
.ob-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 8px; background: var(--card); border-left: 4px solid var(--amber); border-right: 1px solid var(--line); min-width: 0; }
.ob-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ob-step { display: flex; align-items: stretch; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-width: 0; transition: transform .12s, box-shadow .12s; }
.ob-step.sel { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--amber); }
.ob-step.odd { border-style: dashed; }
.ob-grip { flex: none; width: 14px; margin: 8px 0 8px 6px; cursor: grab; background: radial-gradient(circle, var(--field) 1.3px, transparent 1.7px) 0 0 / 7px 7px; }
.ob-step.odd .ob-grip { visibility: hidden; }
.ob-step.lifted { transform: rotate(-.5deg); box-shadow: 0 10px 22px rgba(0, 0, 0, .22); }
.ob-pick { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border: 0; background: none; padding: 8px 10px 8px 2px; font: inherit; font-size: 14px; color: inherit; text-align: left; min-width: 0; }
.ob-txt { min-width: 0; overflow-wrap: anywhere; }
.ob-chip { display: inline-flex; font-family: var(--mono); font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--amber-soft); color: var(--ink); border: 1px solid var(--amber); }
button.ob-chip { padding: 3px 10px; }
button.ob-chip[aria-pressed="false"] { background: var(--card); border-color: var(--field); color: var(--muted); }
button.ob-chip[aria-pressed="true"] { background: var(--amber); color: var(--on-amber); }
.ob-form .chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.ob-form h2, .ob-form h3 { margin: 0; display: flex; gap: 6px; align-items: center; }
.ob-form h3 { font-size: 14px; }
.ob-addform { padding: 6px; border: 1px dashed var(--field); border-radius: 8px; }
.ob-addform input, .ob-addform select { min-width: 0; max-width: 100%; border: 1px solid var(--field); border-radius: 7px; padding: 7px 10px; background: var(--card); color: var(--ink); font-size: 14px; }
.ob-addform input { flex: 1 1 200px; }
.ob-gate .mini { margin-left: 0; }
.ob-addphase { align-self: flex-start; }
/* Parallel lanes, side by side. */
.ob-lanes { display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--plan); padding-left: 8px; min-width: 0; }

  .tf-item-tools .mini, .tf-menu > summary, .tf-chipbox .mini { min-width: 44px; min-height: 44px; justify-content: center; }
  .tf-chip button { width: 36px; height: 36px; }

  .tf-help { font-size: 13px; }

  .tf-field .tf-chipbox input { min-height: 34px; }
  .fpe-head .tl-what { display: none; }
  .fpe-type .tf-field .mono { font-size: 16px; }

/* ---------- Builder refinements: reading flow, hierarchy and states ---------- */
/* Preview: copy and its labels apart, so badges never break; lanes as labeled groups; a gate as one sentence. */

/* Step rows: a stable icon column, the text, then its labels (beside it when there's room, below it in a lane). */

.ob-pick > .ic { margin-top: 2px; }
.ob-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
.ob-txt { flex: 1 1 240px; min-width: 0; line-height: 1.4; }
.ob-lane .ob-txt { flex-basis: 100%; }
.ob-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; }
.ob-meta .badge { display: inline-flex; white-space: nowrap; }
.ob-role { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

.ob-lane { border: 1px solid var(--line); }

.ob-sec { padding-top: 16px; border-top: 1px solid var(--line); }

/* The header: identity | tools | save, which never trade places. */
.fpe-head { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto; grid-template-areas: "id tools save"; align-items: center; gap: 8px 12px; }

@media (max-width: 1240px) { .fpe-head { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id save" "tools tools"; } }
/* Panes: room for the outline at 1280; a narrower inspector. */
.fpe-panes { grid-template-columns: 208px minmax(0, 1fr) clamp(320px, 27vw, 400px); }
.fpe-panes.rail { grid-template-columns: 72px minmax(0, 1fr) clamp(320px, 27vw, 400px); }

/* Parts: a tray. Everyday parts explain themselves; type entries are compact; the search looks like a field. */
.ob-q { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--field); border-radius: 7px; background: var(--card); }
.ob-plist { gap: 12px; }
.ob-part { position: relative; }

.fpe-panes.rail .ob-part:hover::after, .fpe-panes.rail .ob-part:focus-visible::after { content: attr(data-tip); position: fixed; margin-left: 52px; z-index: 30; padding: 6px 8px; border-radius: 6px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
@media (min-width: 801px) and (max-width: 1100px) {

  .fpe-parts .ob-part:hover::after, .fpe-parts .ob-part:focus-visible::after { content: attr(data-tip); position: fixed; margin-left: 52px; z-index: 30; padding: 6px 8px; border-radius: 6px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
