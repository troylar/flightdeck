<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preflight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23E7A300%27/%3E%3Cpath d=%27M4 8.5l2.5 2.5L12 5%27 stroke=%27%2316202A%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
<style>
/* Layout: a flight-deck checklist. Home lists every running checklist; a run shows pause points on a rail, steps in the middle, references on the right. No external resources: system fonts only. */
:root {
  --paper: #F3F5F1; --card: #FFFFFF; --ink: #16202A; --muted: #59646E; --line: #D6DCD4; --chip: #E8ECE6;
  --amber: #E7A300; --on-amber: #241A00; --stripe: #16202A; --amber-soft: #FBF0D2;
  --go: #1D7650; --go-soft: #E1F0E8; --stop: #B0261E; --stop-soft: #F7E3E1; --auto: #5A55A8; --auto-soft: #ECEBF8;
  --focus: #2E6BD3; --shadow: 0 1px 0 rgba(22,32,42,.05), 0 8px 24px rgba(22,32,42,.07);
  --display: 'Bahnschrift SemiCondensed', 'Bahnschrift', 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1418; --card: #162027; --ink: #E6ECEF; --muted: #98A6B0; --line: #29353F; --chip: #1E2A33;
  --amber: #F2B705; --on-amber: #1A1300; --stripe: #0E1418; --amber-soft: #3A3010;
  --go: #3CC08A; --go-soft: #163327; --stop: #F2776C; --stop-soft: #3A1F1D; --auto: #A9A5F2; --auto-soft: #25243F;
  --focus: #86B4FF; --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #162027; --ink: #E6ECEF; --muted: #98A6B0; --line: #29353F; --chip: #1E2A33;
  --amber: #F2B705; --on-amber: #1A1300; --stripe: #0E1418; --amber-soft: #3A3010;
  --go: #3CC08A; --go-soft: #163327; --stop: #F2776C; --stop-soft: #3A1F1D; --auto: #A9A5F2; --auto-soft: #25243F;
  --focus: #86B4FF; --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
a { color: var(--focus); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; border-radius: 5px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, var(--stripe) 5px 10px); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.tab[aria-current="page"] { background: var(--chip); color: var(--ink); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.who input { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 8px; width: 130px; }
.folder { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.dotlive { width: 8px; height: 8px; border-radius: 50%; background: var(--go); display: inline-block; }
.dotlive.off { background: var(--amber); }

main { max-width: 1440px; margin: 0 auto; padding-block: 20px 60px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 21px; margin: 0 0 10px; letter-spacing: .02em; }
.small { font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 7px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.go { background: var(--go); color: var(--card); border-color: var(--go); }
.btn.stop { background: var(--stop); color: var(--card); border-color: var(--stop); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; font-size: 13px; color: var(--muted); }
.mini:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
.mini:disabled { opacity: .4; cursor: not-allowed; }
.chipbtn { border: 1px solid var(--line); background: var(--chip); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.cat { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--go); }
.notice { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 8px; background: var(--chip); margin-bottom: 14px; font-size: 14px; }
.notice.bad { background: var(--stop-soft); }
.notice.warn { background: var(--amber-soft); }

/* Home */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 28px; }
.runcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.runcard:hover { border-color: var(--ink); }
.runcard-title { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.state { font-size: 13.5px; font-weight: 600; }
.state.ready, .state.complete { color: var(--go); } .state.stopped { color: var(--stop); }
.lib-group { margin-bottom: 18px; }
.lib-group h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.tpl { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tpl-title { font-weight: 600; font-size: 16px; line-height: 1.25; }
.tpl .row { justify-content: space-between; }
.path { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.path li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; }
.path b { display: block; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; background: var(--chip); }
.cands { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.cands li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 8px; border-radius: 6px; background: var(--auto-soft); }
.filter { display: inline-flex; gap: 4px; padding: 3px; border-radius: 99px; background: var(--chip); }
.filter .chipbtn { border: 0; background: none; }
.filter .chipbtn[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }

/* Run */
.runhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.ctx { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.ctxchip { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; font-family: var(--mono); font-size: 12.5px; }
.ctxchip span { color: var(--muted); }
.ctxchip.empty { border-style: dashed; color: var(--muted); }
.ctxedit { display: flex; gap: 6px; align-items: center; }
.ctxedit input { border: 1px solid var(--ink); border-radius: 6px; padding: 3px 8px; font-family: var(--mono); font-size: 12.5px; width: 180px; background: var(--card); }
.headline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; border: 1px solid var(--line); background: var(--card); }
.headline[data-s="working"] { border-left: 6px solid var(--amber); }
.headline[data-s="ready"] { border-left: 6px solid var(--go); background: var(--go-soft); }
.headline[data-s="stopped"] { border-left: 6px solid var(--stop); background: var(--stop-soft); }
.headline[data-s="complete"] { border-left: 6px solid var(--go); }
.headline-text { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; }

.run { display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.rail { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 6px; }
.rail-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 9px 10px; }
.rail-item:hover { background: var(--card); border-color: var(--line); }
.rail-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; border: 1.5px solid var(--line); }
.rail-item[data-status="called"] .rail-num { background: var(--go); border-color: var(--go); color: var(--card); }
.rail-item[data-status="open"] .rail-num { border-color: var(--amber); background: var(--amber); color: var(--on-amber); }
.rail-item[data-status="locked"] { color: var(--muted); }
.rail-name { font-weight: 600; line-height: 1.2; }
.rail-count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.deck { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.pp { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.pp[data-status="locked"] { opacity: .55; }
.placard { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 10px 16px 10px 26px; background: var(--amber); color: var(--on-amber); border-bottom: 1px solid var(--line); position: relative; }
.placard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, var(--stripe) 5px 10px); }
.pp[data-status="called"] .placard { background: var(--go-soft); color: var(--ink); }
.pp[data-status="called"] .placard::before { background: var(--go); }
.pp[data-status="locked"] .placard { background: var(--chip); color: var(--muted); }
.pp[data-status="locked"] .placard::before { background: var(--line); }
.pp-label { font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.pp-title { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.mode { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; border: 1.5px solid currentColor; }
.mode-hint { width: 100%; font-size: 13px; opacity: .85; }

.items { list-style: none; margin: 0; padding: 4px 0; }
.item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.sel { background: var(--chip); }
.item[data-state="blocked"] { background: var(--stop-soft); }
.item[data-state="recheck"] { background: var(--amber-soft); }
.check { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--ink); background: var(--card); display: grid; place-items: center; padding: 0; }
.check svg { width: 18px; height: 18px; opacity: 0; stroke: var(--card); }
.check:disabled { cursor: not-allowed; }
.item[data-state="done"] .check { background: var(--go); border-color: var(--go); }
.item[data-state="done"] .check svg { opacity: 1; }
.item[data-state="na"] .check { border-style: dashed; border-color: var(--muted); }
.item[data-state="blocked"] .check { border-color: var(--stop); }
.item[data-kind="auto"] .check { border-color: var(--auto); border-style: dotted; }
.item[data-kind="auto"][data-state="done"] .check { background: var(--auto); border-color: var(--auto); border-style: solid; }
.text { font-size: 16px; font-weight: 500; line-height: 1.35; padding-top: 4px; }
.item[data-state="done"] .text { color: var(--muted); }
.item[data-state="na"] .text { color: var(--muted); text-decoration: line-through; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.badge { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.b-must { background: var(--stop-soft); color: var(--stop); }
.b-auto { background: var(--auto-soft); color: var(--auto); }
.b-plan { background: var(--chip); color: var(--auto); border: 1px dashed var(--auto); }
.b-ref { background: var(--chip); color: var(--muted); }
.b-warn { background: var(--amber-soft); color: var(--ink); }
.b-stop { background: var(--stop); color: var(--card); }
.stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 6px; text-align: right; }
.stamp b { color: var(--ink); font-weight: 500; }
.acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.pick { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }

.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.thumb { width: 88px; height: 56px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
.thumb.proposed { border: 1.5px dashed var(--amber); }
.thumb svg, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb:hover { border-color: var(--ink); }

.gate { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--paper); font-size: 14px; }
.gate .warn { color: var(--stop); font-weight: 600; }
.gate .ok { color: var(--go); font-weight: 600; }

.ref { position: sticky; top: 76px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 100px); overflow: auto; }
.ref h3 { font-family: var(--display); font-size: 22px; line-height: 1.15; margin: 0; }
.ref-empty { color: var(--muted); font-size: 14px; }
.note { font-size: 14.5px; line-height: 1.55; }
.note p { margin: 0 0 8px; }
.note ul { margin: 0 0 8px; padding-left: 18px; }
.zoomable { padding: 0; border: 0; background: none; width: 100%; text-align: left; }
figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
figure.proposed { border: 1.5px dashed var(--amber); }
figure svg, figure img { display: block; width: 100%; height: auto; max-width: 100%; }
figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); background: var(--card); }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.close { display: none; }

/* Templates */
.tgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
.tlist { display: flex; flex-direction: column; gap: 10px; }
.tcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.tcard[aria-current="true"] { border-color: var(--ink); box-shadow: var(--shadow); }
.tcard-title { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.1; }
.tview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.prev-pp { margin-bottom: 14px; }
.prev-pp h4 { margin: 0 0 6px; font-family: var(--display); font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prev-pp ul { margin: 0; padding-left: 18px; font-size: 14px; }
.prev-pp li { margin: 3px 0; }
.health { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.health li { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: baseline; }
.lvl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 2px 0; border-radius: 4px; }
.lvl.ok { background: var(--go-soft); color: var(--go); }
.lvl.warn { background: var(--stop-soft); color: var(--stop); }
.lvl.info { background: var(--auto-soft); color: var(--auto); }
pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; margin: 0; overflow-x: auto; }
.src { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 560px; overflow: auto; }

/* Summary */
.sumwrap { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.sum { width: min(780px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.sum-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.sum-title { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; }
.sum-status { font-weight: 600; }
.sum-status.stopped { color: var(--stop); } .sum-status.ready, .sum-status.complete { color: var(--go); }
.sum-pp h4 { margin: 0 0 4px; font-family: var(--display); font-size: 17px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sum-pp h4 span { font-family: var(--mono); font-size: 11.5px; font-weight: 400; color: var(--muted); }
.sum-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; font-size: 14px; padding: 3px 0; border-top: 1px solid var(--line); }
.sum-ic { font-family: var(--mono); font-weight: 600; text-align: center; }
.sum-ic.done { color: var(--go); } .sum-ic.na { color: var(--muted); } .sum-ic.blocked { color: var(--stop); } .sum-ic.recheck { color: var(--amber); }
.sum-st { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.sum-foot { font-family: var(--mono); font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(8,12,16,.82); display: grid; place-items: center; padding: 16px; }
.lb-box { width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
.lb-media { background: var(--card); border-radius: 10px; overflow: auto; max-height: calc(100vh - 140px); }
.lb-media svg, .lb-media img { display: block; width: 100%; height: auto; }
.lb-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #EEF2F4; }
.lb-cap { flex: 1; min-width: 0; font-weight: 600; }
.lb-count { font-family: var(--mono); font-size: 12px; opacity: .8; }
.lb-bar button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #EEF2F4; border-radius: 7px; padding: 6px 12px; font-weight: 600; }

.s-bg { fill: var(--card); } .s-line { stroke: var(--line); fill: none; } .s-go { fill: var(--go); } .s-chip { fill: var(--chip); }
.s-ink { fill: var(--ink); font-family: var(--mono); font-size: 10px; } .s-mut { fill: var(--muted); font-family: var(--mono); font-size: 9px; }
.s-stop { fill: var(--stop); }

@media (max-width: 1180px) {
  .run { grid-template-columns: 200px minmax(0, 1fr); }
  .ref { position: fixed; top: auto; right: 12px; bottom: 12px; width: min(380px, calc(100vw - 24px)); max-height: 70vh; z-index: 8; }
  .ref[data-open="false"] { display: none; }
  .close { display: inline-block; align-self: flex-end; }
  .home { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 780px) {
  .run, .tgrid, .tview { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; flex-direction: row; overflow-x: auto; }
  .rail-item { grid-template-columns: 26px auto; }
  .rail-count { display: none; }
  .item { grid-template-columns: 34px minmax(0, 1fr); }
  .item > .side { grid-column: 2; }
  .stamp, .acts { text-align: left; justify-content: flex-start; }
  .who { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="top-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Preflight</div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-view="home">Home</button>
      <button class="tab" data-view="run">Run</button>
      <button class="tab" data-view="templates">Templates</button>
    </nav>
    <div class="folder" id="folder"></div>
    <label class="who" for="who">Your name <input id="who" list="names" autocomplete="off" spellcheck="false"><datalist id="names"></datalist></label>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-cap" hidden>
  <div class="lb-box">
    <div class="lb-bar"><span class="lb-cap" id="lb-cap"></span><span class="lb-count" id="lb-count"></span>
      <button id="lb-prev" aria-label="Previous screenshot">‹ Prev</button><button id="lb-next" aria-label="Next screenshot">Next ›</button><button id="lb-close">Close</button></div>
    <div class="lb-media" id="lb-media"></div>
  </div>
</div>

<script id="pf-core">
/* Pure logic: no DOM. The test harness loads this block on its own. */
var PF = (function () {
  'use strict';
  var VERSION = '0.1.0';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function safeUrl(u) {
    return /^(https?:\/\/|mailto:)[^\s"'<>]+$/i.test(u) ? u : null;
  }
  /* Markdown subset, escape-first: raw HTML in templates is shown as text, never run. */
  function mdInline(s) {
    var codes = [];
    var t = esc(s).replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
        var raw = url.replace(/&amp;/g, '&'), ok = safeUrl(raw);
        return ok ? '<a href="' + esc(ok) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : label;
      });
    return t.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
  }
  function mdBlock(s) {
    var out = [], list = null, para = [];
    function flushP() { if (para.length) { out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = []; } }
    function flushL() { if (list) { out.push('<ul>' + list.map(function (x) { return '<li>' + mdInline(x) + '</li>'; }).join('') + '</ul>'); list = null; } }
    String(s).split('\n').forEach(function (line) {
      var m = /^\s*[-*]\s+(.*)$/.exec(line);
      if (m) { flushP(); (list = list || []).push(m[1]); }
      else if (!line.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(line.trim()); }
    });
    flushP(); flushL();
    return out.join('');
  }

  function parse(md) {
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n'), meta = {}, sections = [], errors = [], i = 0, cur = null, last = null;
    if (lines[0] && lines[0].trim() === '---') {
      for (i = 1; i < lines.length && lines[i].trim() !== '---'; i++) {
        var kv = /^(\w+):\s*(.*)$/.exec(lines[i]);
        if (kv) meta[kv[1]] = kv[2].trim();
      }
      i++;
    }
    meta.ctx = (meta.context || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return /^[\w-]+$/.test(s); });
    for (; i < lines.length; i++) {
      var line = lines[i], m;
      if (!line.trim()) continue;
      if ((m = /^##\s+(.+?)\s*$/.exec(line))) {
        var mm = /^(.*?)\s+·\s+(READ-DO|DO-CONFIRM)$/.exec(m[1]);
        cur = { title: mm ? mm[1] : m[1], mode: mm ? mm[2] : '', items: [] };
        if (/^questions\b/i.test(cur.title)) { cur.questions = true; }
        sections.push(cur); last = null;
      } else if (cur && (m = /^- \[( |!|~|auto)\]\s+(.+)$/.exec(line))) {
        var binds = [], text = m[2].replace(/\s*\^([\w-]+)/g, function (_, f) { binds.push(f); return ''; }).trim();
        last = { text: text, kind: { '!': 'must', '~': 'plan', 'auto': 'auto' }[m[1]] || 'step', binds: binds, note: '', shots: [] };
        cur.items.push(last);
      } else if (last && (m = /^\s{2,}!\[(.*?)\]\((shot:[\w-]+|images\/[\w./-]+)\)\s*$/.exec(line)) && m[2].indexOf('..') < 0) {
        last.shots.push({ caption: m[1], src: m[2] });
      } else if (last && (m = /^\s{2,}>\s?(.*)$/.exec(line))) {
        last.note += (last.note ? '\n' : '') + m[1];
      } else {
        errors.push('Line ' + (i + 1) + ' isn\'t understood and was skipped: "' + line.trim().slice(0, 50) + '"');
      }
    }
    var questions = sections.filter(function (s) { return s.questions; });
    sections = sections.filter(function (s) { return !s.questions; });
    return { meta: meta, sections: sections, errors: errors, questions: questions };
  }

  var FLUFF = /^(make sure|ensure|don't forget|remember to|be sure)/i;
  function health(t) {
    var out = [], musts = 0, plans = 0, autos = 0;
    t.errors.forEach(function (e) { out.push({ l: 'warn', t: e }); });
    if (!t.meta.title) out.push({ l: 'warn', t: 'Front matter needs a title.' });
    if (t.questions.length) out.push({ l: 'warn', t: 'Open questions for the owner. Answer them and remove the section before the team runs this.' });
    if (!t.sections.length) out.push({ l: 'warn', t: 'No pause points. Start one with "## Name · READ-DO".' });
    t.sections.forEach(function (s) {
      var n = s.items.length;
      if (!s.mode) out.push({ l: 'warn', t: '"' + s.title + '" needs a type: READ-DO (read each step, then do it) or DO-CONFIRM (do the work, then stop and confirm together).' });
      if (n > 9) out.push({ l: 'warn', t: '"' + s.title + '" has ' + n + ' steps. Keep a pause point under 10, or split it at a natural stopping point.' });
      if (n === 0) out.push({ l: 'warn', t: '"' + s.title + '" has no steps.' });
      s.items.forEach(function (it) {
        if (it.kind === 'must') musts++;
        if (it.kind === 'plan') plans++;
        if (it.kind === 'auto') autos++;
        var words = it.text.split(/\s+/).length;
        if (words > 12) out.push({ l: 'warn', t: '"' + it.text.slice(0, 44) + '…" is ' + words + ' words. Move the explanation into a note.' });
        if (FLUFF.test(it.text)) out.push({ l: 'warn', t: '"' + it.text.slice(0, 44) + '" starts with filler. Name the action or the state to confirm.' });
        it.binds.forEach(function (f) { if (t.meta.ctx.indexOf(f) < 0) out.push({ l: 'warn', t: '"' + it.text.slice(0, 44) + '" is tied to ^' + f + ', which isn\'t listed in context.' }); });
      });
    });
    if (t.sections.length && !musts) out.push({ l: 'warn', t: 'No must-do steps. Mark the steps whose omission causes real harm with [!].' });
    else if (musts) out.push({ l: 'ok', t: musts + ' must-do steps. They can\'t be marked N/A.' });
    if (plans || autos) out.push({ l: 'info', t: (autos ? autos + ' automated (someone records pass or fail). ' : '') + (plans ? plans + ' marked "automation planned" (still done by hand).' : '') });
    var warns = out.filter(function (x) { return x.l === 'warn'; }).length;
    if (!warns) out.push({ l: 'ok', t: 'Every pause point has a type and short steps.' });
    return { items: out, warns: warns };
  }

  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'run'; }
  /* Problems that make a template unsafe to run: a skipped line could silently drop a step. */
  function blockers(t) {
    var out = t.errors.slice();
    if (!t.meta.title) out.push('Front matter needs a title.');
    if (!t.sections.length) out.push('There are no pause points.');
    if (t.questions.length) out.push('It still has open questions for the owner.');
    t.sections.forEach(function (s) {
      if (!s.items.length) out.push('"' + s.title + '" has no steps.');
      s.items.forEach(function (it) { it.binds.forEach(function (f) { if (t.meta.ctx.indexOf(f) < 0) out.push('"' + it.text.slice(0, 40) + '" is tied to ^' + f + ', which isn\'t listed in context.'); }); });
    });
    return out;
  }
  function autoName(r, t) {
    if (r.nameCustom) return r.name;
    var first = t.meta.ctx[0], d = new Date(r.started);
    return (t.meta.title || r.template) + ' · ' + (first && r.ctx[first] ? r.ctx[first] : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
  }
  function newRun(tid, md, who, now, rand) {
    var p = parse(md), ctx = {}, d = new Date(now), id = (rand || Math.random().toString(36).slice(2, 8));
    p.meta.ctx.forEach(function (f) { ctx[f] = ''; });
    var stamp = d.toISOString().replace(/[-:]/g, '').slice(0, 13) + 'Z';
    var r = { format: 'preflight-run/1', id: id, template: tid, name: '', nameCustom: false, category: p.meta.category || 'Other', lead: who, recorders: [who], session: null,
      started: d.toISOString(), snapshot: md, ctx: ctx, checks: {}, called: {}, auto: {}, proposed: {}, ended: null, rev: 0,
      file: stamp + '__' + slug(tid) + '__' + id + '.json' };
    r.name = autoName(r, p);
    return r;
  }

  function itemDone(r, key, it) {
    if (it.kind === 'auto') return r.auto[key] === 'pass';
    var c = r.checks[key];
    if (!c) return false;
    if (c.s === 'done') return true;
    return c.s === 'na' && it.kind !== 'must';
  }
  function isBlocked(r, key, it) {
    var c = r.checks[key];
    return (c && c.s === 'blocked') || (it.kind === 'auto' && r.auto[key] === 'fail');
  }
  function sectionInfo(r, t, si) {
    var s = t.sections[si], done = 0, mustLeft = 0, blocked = 0, left = 0;
    s.items.forEach(function (it, ii) {
      var key = si + '.' + ii;
      if (itemDone(r, key, it)) done++;
      else { left++; if (it.kind === 'must') mustLeft++; }
      if (isBlocked(r, key, it)) blocked++;
    });
    return { done: done, total: s.items.length, left: left, mustLeft: mustLeft, blocked: blocked };
  }
  /* A called pause point stays called only while every step still has an answer. */
  function normalize(r, t) {
    var changed = false;
    for (var si = 0; si < t.sections.length; si++) {
      var ok = sectionInfo(r, t, si).left === 0 && (si === 0 || r.called[si - 1]);
      if (r.called[si] && !ok) { delete r.called[si]; changed = true; }
    }
    return changed;
  }
  function status(r, si) {
    if (r.called[si]) return 'called';
    return si === 0 || r.called[si - 1] ? 'open' : 'locked';
  }
  function canCall(r, t, si) { return !r.ended && !r.called[si] && sectionInfo(r, t, si).left === 0 && (si === 0 || !!r.called[si - 1]); }
  function allCalled(r, t) { for (var si = 0; si < t.sections.length; si++) if (!r.called[si]) return false; return true; }
  /* Completed only when every pause point was called; stopping early is always allowed. */
  function canEnd(r, t, outcome) { return !r.ended && (outcome !== 'Completed' || allCalled(r, t)); }
  /* Reopening a pause point also reopens the ones after it; answers are kept. */
  function reopen(r, si) { for (var k in r.called) if (+k >= si) delete r.called[k]; }
  function decision(r, t) {
    if (r.ended) return { s: r.ended.outcome === 'Completed' ? 'complete' : 'stopped', text: 'Ended: ' + r.ended.outcome, sub: 'by ' + r.ended.by };
    for (var si = 0; si < t.sections.length; si++) {
      var items = t.sections[si].items;
      for (var ii = 0; ii < items.length; ii++) {
        if (isBlocked(r, si + '.' + ii, items[ii])) return { s: 'stopped', text: 'Stopped: "' + items[ii].text + '" is blocked', sub: 'Resolve it, or end the run.', si: si };
      }
    }
    for (si = 0; si < t.sections.length; si++) {
      if (r.called[si]) continue;
      var info = sectionInfo(r, t, si), title = t.sections[si].title;
      if (info.left === 0) return { s: 'ready', text: 'Ready to call "' + title + '"', sub: 'Stop and confirm together before moving on.', si: si };
      var waiting = t.sections[si].items.some(function (it, j) { return it.kind === 'auto' && !r.auto[si + '.' + j]; });
      return { s: 'working', text: 'Working: ' + title, sub: info.left + ' step' + (info.left > 1 ? 's' : '') + ' left' + (info.mustLeft ? ', ' + info.mustLeft + ' must-do' : '') + (waiting ? '. Waiting for an automated result.' : '.'), si: si };
    }
    return { s: 'complete', text: 'All pause points called', sub: 'End the run when you\'re done.' };
  }
  function totals(r, t) {
    var d = 0, n = 0;
    t.sections.forEach(function (s, si) { var i = sectionInfo(r, t, si); d += i.done; n += i.total; });
    return { d: d, n: n };
  }
  /* Changing a run detail sends steps tied to it back for a re-check. */
  function setContext(r, t, field, value, who, now) {
    var old = String(r.ctx[field] || '').trim(), v = String(value).trim();
    if (v === old) return 0;
    r.ctx[field] = v;
    var n = 0;
    t.sections.forEach(function (s, si) {
      s.items.forEach(function (it, ii) {
        var k = si + '.' + ii, c = r.checks[k];
        if (it.binds.indexOf(field) < 0) return;
        if (c && (c.s === 'done' || c.s === 'na')) { r.checks[k] = { s: 'recheck', reason: field + ' changed', by: who, at: now }; n++; }
        if (it.kind === 'auto' && r.auto[k]) { delete r.auto[k]; n++; }
      });
    });
    r.name = autoName(r, t);
    normalize(r, t);
    return n;
  }
  function isMine(r, who) {
    if (!who) return false;
    return r.lead === who || (r.recorders || []).indexOf(who) >= 0;
  }
  function hm(isoStr) { var d = new Date(isoStr); return isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function stepState(r, key, it) {
    if (it.kind === 'auto') return { s: { pass: 'done', fail: 'blocked' }[r.auto[key]] || 'open', note: { pass: 'automation passed', fail: 'automation failed' }[r.auto[key]] || 'waiting for result' };
    var c = r.checks[key];
    if (!c) return { s: 'open', note: '' };
    return { s: c.s, note: c.s === 'done' ? c.by + ' ' + hm(c.at) : c.reason + ' · ' + c.by + ' ' + hm(c.at) };
  }
  function label(st, c) {
    if (st === 'done') return 'DONE';
    if (st === 'na') return 'N/A';
    if (st === 'blocked') return 'BLOCKED' + (c && c.reason ? ' - ' + c.reason : '');
    if (st === 'recheck') return 'RE-CHECK' + (c && c.reason ? ' - ' + c.reason : '');
    return 'NOT CHECKED';
  }
  function ctxLine(r, t) { return t.meta.ctx.filter(function (f) { return r.ctx[f]; }).map(function (f) { return f + ': ' + r.ctx[f]; }).join(' · '); }
  function when(isoStr) { var d = new Date(isoStr); return isNaN(d) ? '' : d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  /* Plain text that pastes cleanly into a Jira comment. Leaves out notes, images and file paths. */
  function summaryText(r, t, now) {
    var dcs = decision(r, t), out = ['Preflight: ' + r.name];
    out.push('Checklist: ' + (t.meta.title || r.template) + ' (' + r.category + ')');
    var cl = ctxLine(r, t); if (cl) out.push(cl);
    out.push('Status: ' + (r.ended ? dcs.text : 'In progress. ' + dcs.text));
    out.push('Recorded by ' + (r.recorders && r.recorders.length ? r.recorders.join(', ') : r.lead) + ' · started ' + when(r.started) + ' · captured ' + when(now || new Date().toISOString()));
    out.push('Run ID: ' + r.id, '');
    t.sections.forEach(function (s, si) {
      out.push((si + 1) + '. ' + s.title + (r.called[si] ? ' (called)' : ' (not called)'));
      s.items.forEach(function (it, ii) {
        var k = si + '.' + ii, st = stepState(r, k, it);
        out.push('  [' + (it.kind === 'auto' ? (st.s === 'done' ? 'DONE - automated' : st.s === 'blocked' ? 'BLOCKED - automation failed' : 'NOT CHECKED - automated') : label(st.s, r.checks[k])) + '] ' + it.text);
      });
    });
    return out.join('\n');
  }
  function validRun(o) {
    return o && o.format === 'preflight-run/1' && typeof o.id === 'string' && typeof o.snapshot === 'string' && o.checks && typeof o.checks === 'object';
  }

  return { VERSION: VERSION, esc: esc, mdInline: mdInline, mdBlock: mdBlock, parse: parse, health: health, blockers: blockers, newRun: newRun, slug: slug, autoName: autoName,
    sectionInfo: sectionInfo, normalize: normalize, status: status, canCall: canCall, canEnd: canEnd, allCalled: allCalled, reopen: reopen, decision: decision, totals: totals,
    isBlocked: isBlocked, setContext: setContext, isMine: isMine, hm: hm, when: when, stepState: stepState, ctxLine: ctxLine, summaryText: summaryText, validRun: validRun };
})();
if (typeof module !== 'undefined') module.exports = PF;
</script>
